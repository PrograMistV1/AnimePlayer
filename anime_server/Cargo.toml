[package]
name = "anime_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "form"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
anyhow = "1"
once_cell = "1.21.4"